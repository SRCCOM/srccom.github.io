<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حساب النتائج</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
  
  <style>
  
.alan-sans-<uniquifier> {
  font-family: "Alan Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
}
    * { box-sizing: border-box;
      font-family: "Alan Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: <weight>;
      font-style: normal;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .card {
      width: min(1100px, 100%);
      min-height: 420px;
      background: #1b1b1b;
      border: 1px solid #5F6062;
      border-radius: 34px;
      display: grid;
      place-items: center;
      padding: 60px 24px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    button {
      display: grid;
      place-items: center;
      width: min(300px, 80%);
      height: 150px;
      border: 3px solid #19CC9b;
      border-radius: 16px;
      background: #00B295;
      color: #fff;
      font-size: clamp(16px, 3vw, 30px);
      font-weight: 600;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(2px) scale(.99); }
    button:focus { outline: none; box-shadow: none; }

    @media (max-width: 520px) {
      .card { border-radius: 26px; }
      button { width: min(260px, 85%); height: 50px; }
    }
  </style>
</head>
<body>
  <section class="card" aria-label="زر الحساب">
    <button id="calcBtn" type="button">حساب قصاصة الراتب</button>
    <button id="calcBtn2" type="button">حساب مدور الخدمة</button>
    <button id="calcBtn3" type="button">حساب مدة التسريع</button>
 
  </section>
    <script>
    document.getElementById('calcBtn').addEventListener('click', () => {
      window.location.href = 'https://srccom.github.io/s';
    });
  document.getElementById('calcBtn2').addEventListener('click', () => {
      window.location.href = 'https://srccom.github.io/r';
    });
  document.getElementById('calcBtn3').addEventListener('click', () => {
      window.location.href = 'https://srccom.github.io/';
    });
  
  </script>
</body>
</html>
