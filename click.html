<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حساب النتائج</title>
  <style>
  
.alan-sans-<uniquifier> {
  font-family: "Alan Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: <weight>;
  font-style: normal;
}
    * { box-sizing: border-box; font-family: Arial, Tahoma, sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .card {
      width: min(1100px, 100%);
      min-height: 420px;
      background: #1b1b1b;
      border: 1px solid #2c2c2c;
      border-radius: 34px;
      display: grid;
      place-items: center;
      padding: 60px 24px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    button {
      display: grid;
      place-items: center;
      width: min(300px, 80%);
      height: 150px;
      border: 1px solid #fff;
      border-radius: 35px;
      background: #43c2aa;
      color: #fff;
      font-size: clamp(16px, 3vw, 30px);
      font-weight: 600;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, filter .15s ease;
    }

    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(2px) scale(.99); }
    button:focus { outline: none; box-shadow: none; }

    @media (max-width: 520px) {
      .card { border-radius: 26px; }
      button { width: min(260px, 85%); height: 50px; }
    }
  </style>
</head>
<body>
  <section class="card" aria-label="زر الحساب">
    <button id="calcBtn" type="button"><link href="http://srccom.github.io">حساب النتائج</button>
  </section>
</body>
</html>
