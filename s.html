<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title> قصاصة الراتب </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
</head>
<style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--sans); }
        :root {
            --text: #1d1d1f;
            --text-2: #6e6e73;
            --text-3: #86868b;
            --text-4: #aeaeb2;
            --border: #CCCCCC;
            --surface: #fff;
            --bg: #f5f5f7;
            --accent: #0066cc;
            --danger: #ff3b30;
            --light-green: #00B295;
            --light-green-text: #FFFFFF;
            --sans: "Alan Sans", "SF Pro Text", "Segoe UI", Tahoma, Arial, sans-serif;
            --shadow: 0 12px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
            color-scheme: light;
        }
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93; --text-4: #6e6e73;
                --border: #38383a; --surface: #1c1c1e; --bg: #000;
                --accent: #4da3ff; --danger: #ff6961;
                --shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93; --text-4: #6e6e73;
            --border: #38383a; --surface: #1c1c1e; --bg: #000;
            --accent: #4da3ff; --danger: #ff6961;
            --shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
        }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        body { background: var(--bg); color: var(--text); direction: rtl; -webkit-font-smoothing: antialiased; }
        .hidden { display: none !important; }

        .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; width: 100%; }

        .hero { text-align: center; padding: 44px 16px 8px; }
        .hero h1 { font-size: 30px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
        .print-only-header { display: none; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; }

        .card {
            max-width: 680px; width: 100%; margin: 22px auto 0; padding: 28px 24px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 26px; box-shadow: var(--shadow);
        }
        .card-head { text-align: center; margin-bottom: 22px; }
        .card-head h3 { font-size: 13px; font-weight: 600; color: var(--text-3); }

        .f-row { display: flex; flex-direction: column; gap: 18px; width: 100%; margin-bottom: 6px; }
        .form-group { width: 100%; min-width: 0; display: flex; flex-direction: column; }
        .lb { font-size: 13px; color: var(--text-2); margin-bottom: 6px; min-height: 20px; line-height: 1.4; }

        .in {
            display: block; width: 100%; min-width: 0; max-width: 100%; margin: 0;
            -webkit-appearance: none; appearance: none;
            border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px;
            font-size: 15px; background: var(--bg); color: var(--text);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        select.in {
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2386868b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: left 12px center; background-size: 10px 10px;
            padding-left: 32px;
        }
        .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

        .n { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

        .btn-row { text-align: center; margin: 26px auto 0; max-width: 680px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .btn {
            display: inline-block; font-size: 15px; font-weight: 600;
            color: var(--light-green-text); background: var(--light-green);
            border: 1px solid rgba(0,0,0,.16); border-radius: 980px; padding: 13px 44px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            transition: opacity .15s ease, transform .1s ease;
        }
        .btn:hover { opacity: .85; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .btn.secondary { background: var(--accent); }
        .btn.neutral { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
        #printBtn { display: none; }

        .loading-indicator { display: none; text-align: center; margin: 20px 0; padding: 14px 18px; background: var(--bg); border-radius: 16px; font-size: 15px; font-weight: 600; color: var(--text-2); }
        .loading-indicator i { font-size: 18px; color: var(--accent); margin-left: 10px; animation: spin 1.5s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results card: shown only when at least one result block is visible */
        .result-card:not(:has(> .result:not(.hidden), > .details:not(.hidden))) { display: none; }
        .result { border-radius: 16px; padding: 14px 18px; text-align: center; width: 100%; margin-bottom: 12px; background: var(--bg); font-size: 19px; font-weight: 600; line-height: 1.35; color: var(--text); }
        .result span { font-weight: 600; color: var(--light-green); margin: 0 4px; direction: ltr; display: inline-block; }
        #serviceDuration { font-size: 15px; color: var(--text-2); }
        .details { border-radius: 16px; padding: 14px 18px; width: 100%; background: var(--bg); font-size: 15px; font-weight: 500; line-height: 1.8; color: var(--text); text-align: center; }
        .details h4 { font-size: 13px; font-weight: 600; color: var(--text-3); margin: 6px 0 6px; line-height: 1.4; }
        .details hr { border: none; border-top: 1px solid var(--border) !important; margin: 6px 0 10px !important; }
        .details strong { font-size: 13px; font-weight: 600; color: var(--text-3); }
        .details span { font-weight: 600; margin: 0 4px; direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
        .details ul { list-style: none; direction: rtl; text-align: center; padding: 0; margin: 0 0 14px; }
        
        .details li:last-child { border-bottom: none; }

        .sig { text-align: center; font-size: 11px; color: var(--text-4); margin-top: 28px; }

    footer { text-align: center; padding-top: 12px; }
    .welcome { font-size: 14px; font-weight: 600; }
    .clock { margin-top: 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

        @media (max-width: 600px) {
            .wrap { padding: 16px 12px 32px; }
            .card { padding: 22px 14px; }
            .f-row { gap: 14px; }
            .btn { padding: 13px 32px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

        @page { size: A4; margin: 10mm; }
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background-color: var(--surface) !important; }
            .hero, .no-print, .btn-row, .loading-indicator, .sig { display: none !important; }
            .card:not(.result-card) { display: none !important; }
            .wrap { padding-top: 0 !important; }
            .print-only-header { display: block !important; }
            .card { box-shadow: none !important; border: 1px solid var(--border) !important; margin-top: 0 !important; }
            .card-head { display: none; }
            .result { padding: 10px 14px !important; margin-bottom: 10px !important; page-break-inside: avoid; }
            .details { padding: 14px 18px !important; line-height: 1.5 !important; page-break-inside: avoid; }
            .details li { padding: 2px 0 !important; }
        }
    </style>


<body>

<div class="wrap">
    <header class="hero no-print">
        <h1>قصاصة الراتب</h1>
    </header>
    <div class="print-only-header">قصاصة الراتب</div>

    <form id="salaryForm" class="no-print">
        <section class="card">
            <div class="card-head"><h3>العلاوة والترفيع</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb" for="dateOfAppointment">تاريخ التعيين</label>
                    <input class="in n" type="date" id="dateOfAppointment" name="dateOfAppointment">
                </div>
                <div class="form-group">
                    <label class="lb" for="lastPromotionDate">تاريخ آخر ترفيع</label>
                    <input class="in n" type="date" id="lastPromotionDate" name="lastPromotionDate">
                </div>
                <div class="form-group">
                    <label class="lb" for="degreeType">الشهادة</label>
                    <select class="in" id="degreeType" name="degreeType">
                        <option value="primary">ابتدائية</option>
                        <option value="preparatory">إعدادية</option>
                        <option value="diploma">دبلوم</option>
                        <option value="bachelor" selected>بكلوريوس</option>
                        <option value="master">ماجستير</option>
                        <option value="phd">دكتوراه</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>نظام العمل</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb" for="workType">موقع العمل</label>
                    <select class="in" id="workType" name="workType">
                        <option value="field" selected>فني</option>
                        <option value="admin">إداري</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="workShift">اوقات الدوام</label>
                    <select class="in" id="workShift" name="workShift">
                        <option value="morning" selected>صباحي</option>
                        <option value="shift">مناوب</option>
                    </select>
                </div>
                <div id="overtimeHoursBox" class="form-group">
                    <label class="lb" for="overtimeHoursInput">عدد الساعات الإضافية</label>
                    <input class="in" type="number" id="overtimeHoursInput" name="overtimeHoursInput" min="0" value="" placeholder="أدخل عدد الساعات">
                </div>
                <div id="shiftsBox" class="form-group hidden">
                    <label class="lb" for="shifts">رصيد الاجازات</label>
                    <select class="in" id="shifts" name="shifts">
                        <option value="unauthorized" selected>غير مجاز</option>
                        <option value="authorized">مجاز</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>الدرجة والمرحلة</h3></div>
            <div class="f-row">
                <div class="form-group" id="positionBox">
                    <label class="lb" for="position">المنصب</label>
                    <select class="in" id="position" name="position">
                        <option value="none" selected>لا يوجد</option>
                        <option value="section-head">مسؤول شعبة</option>
                        <option value="department-head">مسؤول قسم</option>
                        <option value="director">مدير هيئة / معاون مدير / مدير عام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="grade">الدرجة الحالية</label>
                    <select class="in" id="grade" name="grade">
                        <option value="10" selected>10</option>
                        <option value="9">9</option>
                        <option value="8">8</option>
                        <option value="7">7</option>
                        <option value="6">6</option>
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>
                <div class="form-group" id="stageBox">
                    <label class="lb" for="stage">المرحلة الحالية</label>
                    <select class="in" id="stage" name="stage">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>المخصصات والإضافات</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb" for="social">الحالة الاجتماعية</label>
                    <select class="in" id="social" name="social">
                        <option value="single" selected>غير متزوج</option>
                        <option value="married">متزوج</option>
                    </select>
                </div>
                <div id="kidsBox" class="form-group hidden">
                    <label class="lb" for="kids">عدد الأطفال</label>
                    <select class="in" id="kids" name="kids">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="bonusMonths">عدد أشهر القدم</label>
                    <input class="in" type="number" id="bonusMonths" name="bonusMonths" value="0" min="0" placeholder="أدخل عدد الأشهر">
                </div>
            </div>
        </section>

        <div id="loadingIndicator" class="loading-indicator hidden">
            <i class="fas fa-spinner"></i> جاري حساب الراتب...
        </div>
        <div class="btn-row">
            <button type="button" class="btn" id="calculateBtn">حساب قصاصتك</button>
           
            <button type="button" class="btn secondary" id="printBtn">حفظ النتائج</button>
        </div>
    </form>

    <section class="card result-card">
        <div class="card-head"><h3>النتيجة</h3></div>
        <div id="salaryResult" class="result hidden"></div>
        <div id="serviceDuration" class="result hidden"></div>
        <div id="detailsBox" class="details hidden"></div>
    </section>

      <footer>
  
    <p class="sig" id="clock" dir="rtl"></p>
    
    </footer>

</div>
 <script src="https://srccom.github.io/s.js"></script>
</body>
</html>
