<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title> قصاصة الراتب </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--sans); }
        :root {
            --text: #1d1d1f;
            --text-2: #6e6e73;
            --text-3: #86868b;
            --text-4: #aeaeb2;
            --border: #CCCCCC;
            --surface: #fff;
            --bg: #f5f5f7;
            --accent: #0066cc;
            --danger: #ff3b30;
            --light-green: #00B295;
            --light-green-text: #FFFFFF;
            --sans: "Alan Sans", "SF Pro Text", "Segoe UI", Tahoma, Arial, sans-serif;
            --shadow: 0 12px 32px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.04);
            color-scheme: light;
        }
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93; --text-4: #6e6e73;
                --border: #38383a; --surface: #1c1c1e; --bg: #000;
                --accent: #4da3ff; --danger: #ff6961;
                --shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93; --text-4: #6e6e73;
            --border: #38383a; --surface: #1c1c1e; --bg: #000;
            --accent: #4da3ff; --danger: #ff6961;
            --shadow: 0 12px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.35);
        }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        body { background: var(--bg); color: var(--text); direction: rtl; -webkit-font-smoothing: antialiased; }
        .hidden { display: none !important; }

        .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; width: 100%; }

        .hero { text-align: center; padding: 44px 16px 8px; }
        .hero h1 { font-size: 30px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
        .print-only-header { display: none; text-align: center; font-size: 30px; font-weight: 700; line-height: 1.25; margin-bottom: 14px; }

        .card {
            max-width: 680px; width: 100%; margin: 22px auto 0; padding: 28px 24px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 26px; box-shadow: var(--shadow);
        }
        .card-head { text-align: center; margin-bottom: 22px; }
        .card-head h3 { font-size: 13px; font-weight: 600; color: var(--text-3); }

        .f-row { display: flex; flex-direction: column; gap: 18px; width: 100%; margin-bottom: 6px; }
        .form-group { width: 100%; min-width: 0; display: flex; flex-direction: column; }
        .lb { font-size: 13px; color: var(--text-2); margin-bottom: 6px; min-height: 20px; line-height: 1.4; }

        .in {
            display: block; width: 100%; min-width: 0; max-width: 100%; margin: 0;
            -webkit-appearance: none; appearance: none;
            border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px;
            font-size: 15px; background: var(--bg); color: var(--text);
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        select.in {
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2386868b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: left 12px center; background-size: 10px 10px;
            padding-left: 32px;
        }
        .in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

        .odometer-picker {
            position: relative; width: 100%; height: 132px;
            display: flex; align-items: stretch; justify-content: center; gap: 4px;
            padding: 0 10px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); direction: ltr; overflow: hidden;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .odometer-picker:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
        .odometer-wheel {
            position: relative; flex: 1 1 0; max-width: 64px; height: 100%;
            overflow-y: scroll; scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none;
        }
        .odometer-wheel[data-unit="year"] { flex: 1.5 1 0; max-width: 96px; }
        .odometer-wheel::-webkit-scrollbar { display: none; }
        .odometer-list { display: flex; flex-direction: column; }
        .odometer-list .odometer-item {
            height: 44px; min-height: 44px; max-height: 44px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            scroll-snap-align: center; font-size: 15px; line-height: 1; font-weight: 500;
            color: var(--text-4); font-family: var(--sans);
            font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
            white-space: nowrap; overflow: hidden;
            transition: color 0.15s ease, font-size 0.15s ease, font-weight 0.15s ease;
            user-select: none; cursor: pointer;
        }
        .odometer-list .odometer-item.odometer-active { color: var(--accent); font-size: 19px; font-weight: 600; }
        .odometer-sep { align-self: center; font-size: 18px; line-height: 1; font-weight: 600; color: var(--text-4); }
        .odometer-frame {
            position: absolute; top: 50%; left: 8px; right: 8px;
            transform: translateY(-50%); height: 44px; box-sizing: border-box;
            border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent);
            border-radius: 10px; pointer-events: none; z-index: 1;
        }

        .btn-row { text-align: center; margin: 26px auto 0; max-width: 680px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .btn {
            display: inline-block; font-size: 15px; font-weight: 600;
            color: var(--light-green-text); background: var(--light-green);
            border: 1px solid rgba(0,0,0,.16); border-radius: 980px; padding: 13px 44px;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            transition: opacity .15s ease, transform .1s ease;
        }
        .btn:hover { opacity: .85; }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .btn.secondary { background: var(--accent); }
        .btn.neutral { background: var(--surface); color: var(--text-2); border: 1px solid var(--border); }
        #printBtn { display: none; }

        .loading-indicator { display: none; text-align: center; margin: 20px 0; padding: 14px 18px; background: var(--bg); border-radius: 16px; font-size: 15px; font-weight: 600; color: var(--text-2); }
        .loading-indicator i { font-size: 18px; color: var(--accent); margin-left: 10px; animation: spin 1.5s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Results card: shown only when at least one result block is visible */
        .result-card:not(:has(> .result:not(.hidden), > .details:not(.hidden))) { display: none; }
        .result { border-radius: 16px; padding: 14px 18px; text-align: center; width: 100%; margin-bottom: 12px; background: var(--bg); font-size: 19px; font-weight: 600; line-height: 1.35; color: var(--text); }
        .result span { font-weight: 600; color: var(--light-green); margin: 0 4px; direction: ltr; display: inline-block; }
        #serviceDuration { font-size: 15px; color: var(--text-2); }
        .details { border-radius: 16px; padding: 14px 18px; width: 100%; background: var(--bg); font-size: 15px; font-weight: 500; line-height: 1.8; color: var(--text); text-align: center; }
        .details h4 { font-size: 13px; font-weight: 600; color: var(--text-3); margin: 6px 0 6px; line-height: 1.4; }
        .details hr { border: none; border-top: 1px solid var(--border) !important; margin: 6px 0 10px !important; }
        .details strong { font-size: 13px; font-weight: 600; color: var(--text-3); }
        .details span { font-weight: 600; margin: 0 4px; direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
        .details ul { list-style: none; direction: rtl; text-align: center; padding: 0; margin: 0 0 14px; }
        .details li { padding: 6px 0; text-align: center; direction: rtl; border-bottom: 1px solid var(--border); font-size: 15px; }
        .details li:last-child { border-bottom: none; }

        .sig { text-align: center; font-size: 11px; color: var(--text-4); margin-top: 28px; }

        @media (max-width: 600px) {
            .wrap { padding: 16px 12px 32px; }
            .card { padding: 22px 14px; }
            .f-row { gap: 14px; }
            .btn { padding: 13px 32px; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

        @page { size: A4; margin: 10mm; }
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background-color: var(--surface) !important; }
            .hero, .no-print, .btn-row, .loading-indicator, .sig { display: none !important; }
            .card:not(.result-card) { display: none !important; }
            .wrap { padding-top: 0 !important; }
            .print-only-header { display: block !important; }
            .card { box-shadow: none !important; border: 1px solid var(--border) !important; margin-top: 0 !important; }
            .card-head { display: none; }
            .result { padding: 10px 14px !important; margin-bottom: 10px !important; page-break-inside: avoid; }
            .details { padding: 14px 18px !important; line-height: 1.5 !important; page-break-inside: avoid; }
            .details li { padding: 2px 0 !important; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <header class="hero no-print">
        <h1>قصاصة الراتب</h1>
    </header>
    <div class="print-only-header">قصاصة الراتب</div>

    <form id="salaryForm" class="no-print">
        <section class="card">
            <div class="card-head"><h3>العلاوة والترفيع</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb">تاريخ التعيين</label>
                    <div class="odometer-picker" id="dateOfAppointmentPicker">
                        <div class="odometer-frame"></div>
                        <div class="odometer-wheel" data-unit="year"><div class="odometer-list"></div></div>
                        <span class="odometer-sep">/</span>
                        <div class="odometer-wheel" data-unit="month"><div class="odometer-list"></div></div>
                        <span class="odometer-sep">/</span>
                        <div class="odometer-wheel" data-unit="day"><div class="odometer-list"></div></div>
                    </div>
                    <input type="hidden" id="dateOfAppointment" name="dateOfAppointment" value="">
                </div>
                <div class="form-group">
                    <label class="lb">تاريخ آخر ترفيع</label>
                    <div class="odometer-picker" id="lastPromotionDatePicker">
                        <div class="odometer-frame"></div>
                        <div class="odometer-wheel" data-unit="year"><div class="odometer-list"></div></div>
                        <span class="odometer-sep">/</span>
                        <div class="odometer-wheel" data-unit="month"><div class="odometer-list"></div></div>
                        <span class="odometer-sep">/</span>
                        <div class="odometer-wheel" data-unit="day"><div class="odometer-list"></div></div>
                    </div>
                    <input type="hidden" id="lastPromotionDate" name="lastPromotionDate" value="">
                </div>
                <div class="form-group">
                    <label class="lb" for="degreeType">الشهادة</label>
                    <select class="in" id="degreeType" name="degreeType">
                        <option value="primary">ابتدائية</option>
                        <option value="preparatory">إعدادية</option>
                        <option value="diploma">دبلوم</option>
                        <option value="bachelor" selected>بكلوريوس</option>
                        <option value="master">ماجستير</option>
                        <option value="phd">دكتوراه</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>نظام العمل</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb" for="workType">موقع العمل</label>
                    <select class="in" id="workType" name="workType">
                        <option value="field" selected>فني</option>
                        <option value="admin">إداري</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="workShift">اوقات الدوام</label>
                    <select class="in" id="workShift" name="workShift">
                        <option value="morning" selected>صباحي</option>
                        <option value="shift">مناوب</option>
                    </select>
                </div>
                <div id="overtimeHoursBox" class="form-group">
                    <label class="lb" for="overtimeHoursInput">عدد الساعات الإضافية</label>
                    <input class="in" type="number" id="overtimeHoursInput" name="overtimeHoursInput" min="0" value="" placeholder="أدخل عدد الساعات">
                </div>
                <div id="shiftsBox" class="form-group hidden">
                    <label class="lb" for="shifts">رصيد الاجازات</label>
                    <select class="in" id="shifts" name="shifts">
                        <option value="unauthorized" selected>غير مجاز</option>
                        <option value="authorized">مجاز</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>الدرجة والمرحلة</h3></div>
            <div class="f-row">
                <div class="form-group" id="positionBox">
                    <label class="lb" for="position">المنصب</label>
                    <select class="in" id="position" name="position">
                        <option value="none" selected>لا يوجد</option>
                        <option value="section-head">مسؤول شعبة</option>
                        <option value="department-head">مسؤول قسم</option>
                        <option value="director">مدير هيئة / معاون مدير / مدير عام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="grade">الدرجة الحالية</label>
                    <select class="in" id="grade" name="grade">
                        <option value="10" selected>10</option>
                        <option value="9">9</option>
                        <option value="8">8</option>
                        <option value="7">7</option>
                        <option value="6">6</option>
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>
                <div class="form-group" id="stageBox">
                    <label class="lb" for="stage">المرحلة الحالية</label>
                    <select class="in" id="stage" name="stage">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>المخصصات والإضافات</h3></div>
            <div class="f-row">
                <div class="form-group">
                    <label class="lb" for="social">الحالة الاجتماعية</label>
                    <select class="in" id="social" name="social">
                        <option value="single" selected>غير متزوج</option>
                        <option value="married">متزوج</option>
                    </select>
                </div>
                <div id="kidsBox" class="form-group hidden">
                    <label class="lb" for="kids">عدد الأطفال</label>
                    <select class="in" id="kids" name="kids">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="lb" for="bonusMonths">عدد أشهر القدم</label>
                    <input class="in" type="number" id="bonusMonths" name="bonusMonths" value="0" min="0" placeholder="أدخل عدد الأشهر">
                </div>
            </div>
        </section>

        <div id="loadingIndicator" class="loading-indicator hidden">
            <i class="fas fa-spinner"></i> جاري حساب الراتب...
        </div>
        <div class="btn-row">
            <button type="button" class="btn" id="calculateBtn">حساب قصاصتك</button>
            <button type="button" class="btn neutral" id="resetBtn">تهيئة المدخلات</button>
            <button type="button" class="btn secondary" id="printBtn">حفظ النتائج</button>
        </div>
    </form>

    <section class="card result-card">
        <div class="card-head"><h3>النتيجة</h3></div>
        <div id="salaryResult" class="result hidden"></div>
        <div id="serviceDuration" class="result hidden"></div>
        <div id="detailsBox" class="details hidden"></div>
    </section>

    <footer class="sig">برمجة مالك محمد</footer>
</div>
<script>
    const gradeBase = {
        10: 170000, 9: 185000, 8: 260000, 7: 296000, 6: 362000, 5: 429000, 4: 509000, 3: 600000, 2: 723000, 1: 910000
    };
    const LEADERSHIP_GRADES = ['GM', 'SP', 'UM'];
    const stageAddLogic = (grade) => {
        const defaultAdd = {
            10: 3000, 9: 5000, 8: 3000, 7: 6000, 6: 6000, 5: 6000, 4: 8000, 3: 10000, 2: 17000, 1: 20000
        };
        if (LEADERSHIP_GRADES.includes(grade)) {
            return 83000;
        }
        return defaultAdd[grade] || 0;
    };
    const gradeMaxNominal = {
        10: 200000, 9: 240000
    };
    const DEDUCTIONS = {
        HEALTH_INSURANCE: 00000,
        SOCIAL_SOLIDARITY: 2000,
        CHILD_HOSPITAL_SUPPORT: 1000,
        PREVIOUS_DEDUCTION: 1950
    };
    const POSITION_DEDUCTIONS = {
        'section-head': 0.15,
        'department-head': 0.20,
        'director': 0.30
    };
    const OVERTIME_RATES = {
        'high_grade': 5000,
        'low_grade': 4000,
        'leadership': 5000
    };
    const LOCATION_FIXED_BONUS = 50000;

    function formatDate(dateObj) {
        if (!(dateObj instanceof Date) || isNaN(dateObj)) return "غير محدد";
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}/${month}/${day}`;
    }

    function calculatePromotions(lastPromotionDate, currentGrade, currentStage, bonusMonths) {
        if (!lastPromotionDate) return null;
        const lastDate = new Date(lastPromotionDate);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (LEADERSHIP_GRADES.includes(currentGrade)) {
            return {
                type: 'leadership',
                message: 'درجة قيادية - لا توجد ترقية أو علاوة سنوية تلقائية'
            };
        }
        const gradeNumber = parseInt(currentGrade);
        let originalYears = 0;
        let nextGrade = currentGrade;
        let nextStage = 1;
        let nextPromotionDate = null;
        if (gradeNumber >= 6 && gradeNumber <= 10) {
            originalYears = 5;
            nextGrade = gradeNumber > 6 ? (gradeNumber - 1).toString() : "5";
        } else if (gradeNumber >= 1 && gradeNumber <= 5) {
            originalYears = 6;
            nextGrade = gradeNumber > 1 ? (gradeNumber - 1).toString() : "GM";
        }
        const effectiveYears = originalYears - (currentStage - 1);
        let promotionOverdueYears = 0;
        if (originalYears > 0) {
            if (effectiveYears <= 0) {
                promotionOverdueYears = Math.round(-effectiveYears);
            }
            nextPromotionDate = new Date(lastDate);
            const totalMonthsToWait = Math.round(effectiveYears * 12);
            nextPromotionDate.setMonth(nextPromotionDate.getMonth() + totalMonthsToWait);
            nextPromotionDate.setMonth(nextPromotionDate.getMonth() - bonusMonths);
            nextPromotionDate.setHours(0, 0, 0, 0);
        }
        let nextAnnualIncreaseDate = new Date(lastDate);
        nextAnnualIncreaseDate.setFullYear(nextAnnualIncreaseDate.getFullYear() + 1);
        nextAnnualIncreaseDate.setMonth(nextAnnualIncreaseDate.getMonth() - bonusMonths);
        nextAnnualIncreaseDate.setHours(0, 0, 0, 0);
        while (nextAnnualIncreaseDate.getTime() < today.getTime()) {
            nextAnnualIncreaseDate.setFullYear(nextAnnualIncreaseDate.getFullYear() + 1);
        }
        const annualTimeDiff = nextAnnualIncreaseDate.getTime() - today.getTime();
        const annualDaysDiff = Math.ceil(annualTimeDiff / (1000 * 3600 * 24));
        let annualStatus = 'متبقي';
        if (annualDaysDiff <= 0) {
            annualStatus = 'مستحقة الآن';
        }
        let promotionStatus = 'غير متاحة';
        let promotionDaysDiff = 0;
        if (nextPromotionDate) {
            const promotionTimeDiff = nextPromotionDate.getTime() - today.getTime();
            promotionDaysDiff = Math.ceil(promotionTimeDiff / (1000 * 3600 * 24));
            promotionStatus = 'متبقي';
            if (promotionDaysDiff <= 0) {
                promotionStatus = 'مستحقة الآن';
            }
        }
        return {
            type: 'regular',
            originalYears,
            bonusMonths,
            nextAnnualIncreaseDate: nextAnnualIncreaseDate,
            annualStatus: annualStatus,
            annualDaysRemaining: annualDaysDiff,
            nextPromotionDate: nextPromotionDate,
            promotionStatus: promotionStatus,
            promotionDaysRemaining: promotionDaysDiff,
            yearsToPromotion: effectiveYears,
            promotionOverdueYears: promotionOverdueYears,
            nextGrade: nextGrade,
            nextStage: nextStage,
            currentStage: currentStage
        };
    }

    function getRatePerHoure(grade) {
        if (parseInt(grade) >= 5 && parseInt(grade) <= 10) {
            return OVERTIME_RATES.low_grade;
        } else if (parseInt(grade) >= 1 && parseInt(grade) <= 4) {
            return OVERTIME_RATES.high_grade;
        } else if (LEADERSHIP_GRADES.includes(grade)) {
            return OVERTIME_RATES.leadership;
        }
        return 0;
    }

    function calculateFullSalary(targetGrade, targetStage, degree, workType, social, kids, positionFactor, bonusMonths, workShift, overtimeHoursInput, shifts) {
        const stageIncrement = stageAddLogic(targetGrade);
        let nominal = gradeBase[targetGrade] + ((targetStage - 1) * stageIncrement);
        if (gradeMaxNominal[targetGrade] && nominal > gradeMaxNominal[targetGrade]) {
            nominal = gradeMaxNominal[targetGrade];
        }
        let certFactor;
        switch (degree) {
            case 'primary': certFactor = 0.20; break;
            case 'preparatory': certFactor = 0.25; break;
            case 'diploma': certFactor = 0.35; break;
            case 'bachelor': certFactor = 0.45; break;
            case 'master': certFactor = 0.65; break;
            case 'phd': certFactor = 0.75; break;
            default: certFactor = 0;
        }
        const riskFactor = workType === 'field' ? 0.3 : 0.25;
        let conditionalFactor = 0;
        if (degree !== 'diploma' && degree !== 'primary' && degree !== 'preparatory') {
            conditionalFactor = workType === 'field' ? 0.50 : 0.35;
        }
        const fixedOtherAllowanceFactor = 0.3;
        const totalFactors = certFactor + riskFactor + conditionalFactor + fixedOtherAllowanceFactor;
        const factoredAllowance = Math.round(nominal * totalFactors);
        let familyAllowance = 0;
        if (social === "married") {
            familyAllowance = 50000 + kids * 10000;
        }
        const responsibilityAllowance = Math.round(nominal * positionFactor);
        const bonusAmount = 0;
        let specialAllowance = 0;
        let specialAllowanceDetails = { type: 'None', hours: 0, rate: 0, shiftList: '' };
        const ratePerHoure = getRatePerHoure(targetGrade);
        if (workShift === 'morning' && overtimeHoursInput > 0) {
            specialAllowance = overtimeHoursInput * ratePerHoure;
            specialAllowanceDetails.type = 'Overtime';
            specialAllowanceDetails.hours = overtimeHoursInput;
            specialAllowanceDetails.rate = ratePerHoure;
        } else if (workShift === 'shift') {
            let hours = 0;
            const shiftRate = 4000;
            if (shifts === 'authorized') {
                hours = 22.5;
            } else {
                hours = 26;
            }
            specialAllowance = hours * shiftRate;
            specialAllowanceDetails.type = 'Shift';
            specialAllowanceDetails.hours = hours;
            specialAllowanceDetails.rate = shiftRate;
            specialAllowanceDetails.shiftList = shifts === 'authorized' ? 'مجاز' : 'غير مجاز';
        }
        const retirement = Math.round(0.1 * nominal);
        const fixedDeductions = DEDUCTIONS.HEALTH_INSURANCE + DEDUCTIONS.SOCIAL_SOLIDARITY + DEDUCTIONS.CHILD_HOSPITAL_SUPPORT + DEDUCTIONS.PREVIOUS_DEDUCTION;
        const totalDeductions = retirement + fixedDeductions;
        const grossBeforeDeductions = nominal + factoredAllowance + familyAllowance + responsibilityAllowance + specialAllowance;
        const netAfterDeductions = grossBeforeDeductions - totalDeductions;
        const totalSalary = netAfterDeductions + LOCATION_FIXED_BONUS;
        return { nominal, totalSalary, responsibilityAllowance, totalDeductions, bonusAmount, factoredAllowance, specialAllowance, specialAllowanceDetails };
    }

    function calculateServiceDuration(startDate) {
        if (!startDate) return null;
        const start = new Date(startDate);
        const now = new Date();
        let years = now.getFullYear() - start.getFullYear();
        let months = now.getMonth() - start.getMonth();
        let days = now.getDate() - start.getDate();
        if (days < 0) {
            months--;
            const daysInPreviousMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
            days += daysInPreviousMonth;
        }
        if (months < 0) {
            years--;
            months += 12;
        }
        if (years < 0) {
            return "تاريخ تعيين غير صحيح";
        }
        return { years, months, days };
    }

    const ODOMETER_ITEM_HEIGHT = 44;
    const ODOMETER_REPEATS = 25;

    function daysInMonthOf(year, month) {
        return new Date(year, month, 0).getDate();
    }

    function odometerPad(n) {
        return String(n).padStart(2, '0');
    }

    function createOdometerPicker(pickerId, hiddenInputId, initial) {
        const picker = document.getElementById(pickerId);
        if (!picker) return null;
        const hiddenInput = document.getElementById(hiddenInputId);
        const nowYear = new Date().getFullYear();
        const minYear = nowYear - 70;
        const maxYear = nowYear + 5;
        const yearValues = [];
        for (let y = minYear; y <= maxYear; y++) yearValues.push(y);
        const monthValues = Array.from({ length: 12 }, (_, i) => i + 1);
        const state = { year: initial.year, month: initial.month, day: initial.day };
        const wheels = {};

        function emitValue() {
            hiddenInput.value = `${state.year}/${odometerPad(state.month)}/${odometerPad(state.day)}`;
        }

        function renderWheelItems(unit, values) {
            const wheelEl = picker.querySelector(`.odometer-wheel[data-unit="${unit}"]`);
            const listEl = wheelEl.querySelector('.odometer-list');
            listEl.innerHTML = '';
            const items = [];
            for (let c = 0; c < ODOMETER_REPEATS; c++) {
                values.forEach(v => {
                    const item = document.createElement('div');
                    item.className = 'odometer-item';
                    item.textContent = unit === 'year' ? String(v) : odometerPad(v);
                    item.dataset.value = String(v);
                    listEl.appendChild(item);
                    items.push(item);
                });
            }
            wheelEl.style.paddingTop = ODOMETER_ITEM_HEIGHT + 'px';
            wheelEl.style.paddingBottom = ODOMETER_ITEM_HEIGHT + 'px';
            wheels[unit] = { el: wheelEl, listEl, values, items, suppress: false, settleTimer: null };
        }

        function indexForValue(unit, value) {
            const w = wheels[unit];
            const posInCycle = w.values.indexOf(value);
            const middleCopy = Math.floor(ODOMETER_REPEATS / 2);
            return middleCopy * w.values.length + (posInCycle < 0 ? 0 : posInCycle);
        }

        function setActiveItem(unit, idx) {
            const w = wheels[unit];
            w.items.forEach(it => it.classList.remove('odometer-active'));
            if (w.items[idx]) w.items[idx].classList.add('odometer-active');
        }

        function currentIndex(unit) {
            const w = wheels[unit];
            return Math.round(w.el.scrollTop / ODOMETER_ITEM_HEIGHT);
        }

        function scrollToValue(unit, value) {
            const w = wheels[unit];
            const idx = indexForValue(unit, value);
            w.suppress = true;
            w.el.scrollTop = idx * ODOMETER_ITEM_HEIGHT;
            setActiveItem(unit, idx);
            requestAnimationFrame(() => {
                const cur = wheels[unit];
                if (cur) cur.suppress = false;
            });
        }

        function refreshDayWheel() {
            const maxDay = daysInMonthOf(state.year, state.month);
            const dayValues = Array.from({ length: maxDay }, (_, i) => i + 1);
            if (state.day > maxDay) state.day = maxDay;
            renderWheelItems('day', dayValues);
            scrollToValue('day', state.day);
        }

        function onWheelSettle(unit) {
            const w = wheels[unit];
            if (!w) return;
            const idx = Math.max(0, Math.min(w.items.length - 1, currentIndex(unit)));
            const value = w.values[idx % w.values.length];
            setActiveItem(unit, idx);
            if (unit === 'year') state.year = value;
            if (unit === 'month') state.month = value;
            if (unit === 'day') state.day = value;
            if (unit === 'month' || unit === 'year') {
                refreshDayWheel();
            }
            const copyIndex = Math.floor(idx / w.values.length);
            const middleCopy = Math.floor(ODOMETER_REPEATS / 2);
            if (Math.abs(copyIndex - middleCopy) > 3) {
                scrollToValue(unit, value);
            }
            emitValue();
        }

        function attachWheelEvents(unit) {
            const wheelEl = picker.querySelector(`.odometer-wheel[data-unit="${unit}"]`);
            wheelEl.addEventListener('scroll', () => {
                const w = wheels[unit];
                if (!w || w.suppress) return;
                const idx = Math.max(0, Math.min(w.items.length - 1, currentIndex(unit)));
                setActiveItem(unit, idx);
                clearTimeout(w.settleTimer);
                w.settleTimer = setTimeout(() => onWheelSettle(unit), 130);
            });
            wheelEl.addEventListener('click', (e) => {
                const item = e.target.closest('.odometer-item');
                if (!item) return;
                const w = wheels[unit];
                if (!w) return;
                const idx = w.items.indexOf(item);
                if (idx >= 0) {
                    w.el.scrollTo({ top: idx * ODOMETER_ITEM_HEIGHT, behavior: 'smooth' });
                }
            });
        }

        renderWheelItems('year', yearValues);
        renderWheelItems('month', monthValues);
        const initialMaxDay = daysInMonthOf(state.year, state.month);
        renderWheelItems('day', Array.from({ length: initialMaxDay }, (_, i) => i + 1));
        attachWheelEvents('year');
        attachWheelEvents('month');
        attachWheelEvents('day');
        scrollToValue('year', state.year);
        scrollToValue('month', state.month);
        scrollToValue('day', state.day);
        emitValue();

        return {
            reset(newInitial) {
                state.year = newInitial.year;
                state.month = newInitial.month;
                state.day = newInitial.day;
                const maxDay = daysInMonthOf(state.year, state.month);
                if (state.day > maxDay) state.day = maxDay;
                renderWheelItems('day', Array.from({ length: maxDay }, (_, i) => i + 1));
                scrollToValue('year', state.year);
                scrollToValue('month', state.month);
                scrollToValue('day', state.day);
                emitValue();
            }
        };
    }

    let dateOfAppointmentPickerInstance = null;

    function todayParts() {
        const now = new Date();

    const DEGREE_RANGES = {
        'primary': { min: 10, max: 3 },
        'preparatory': { min: 10, max: 2 },
        'diploma': { min: 8, max: 1 },
        'bachelor': { min: 7, max: 1 },
        'master': { min: 7, max: 1 },
        'phd': { min: 7, max: 1 }
    };

    const LEADERSHIP_OPTIONS = [
        { value: 'GM', text: 'المدير العام ومن بدرجته' },
        { value: 'SP', text: 'الدرجة الخاصة' },
        { value: 'UM', text: 'وكيل وزارة ومن بدرجته' }

    function updateGradeOptions() {
        const degree = document.getElementById('degreeType').value;
        const position = document.getElementById('position').value;
        const gradeSelect = document.getElementById('grade');
        const currentGrade = gradeSelect.value;
        gradeSelect.innerHTML = '';
        const range = DEGREE_RANGES[degree];
        if (!range) return;
        for (let g = range.min; g >= range.max; g--) {
            const option = document.createElement('option');
            option.value = String(g);
            option.textContent = String(g);
            gradeSelect.appendChild(option);
        }
        if (position !== 'none') {
            LEADERSHIP_OPTIONS.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.value;
                option.textContent = opt.text;
                gradeSelect.appendChild(option);
            });
        }
        const availableValues = Array.from(gradeSelect.options).map(o => o.value);
        if (availableValues.includes(currentGrade)) {
            gradeSelect.value = currentGrade;
        } else {
            gradeSelect.value = String(range.min);
        }
        updateStageVisibility();
    }

        const grade = document.getElementById('grade').value;
        const stageBox = document.getElementById('stageBox');

            document.getElementById("detailsBox").classList.remove('hidden');

        }, 800);
    }

        document.getElementById("resetBtn").addEventListener('click', resetForm);
        document.getElementById("printBtn").addEventListener('click', printResults);
        document.getElementById("degreeType").addEventListener('change', updateGradeOptions);
