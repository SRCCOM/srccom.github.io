<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>التسارع الوظيفي</title>

  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://srccom.github.io/q.css">
</head>
<body>
  <div class="wrap">

    <!-- العنوان -->
    <div class="hero">
      <h1>التسارع الوظيفي</h1>
      <p>احسب عدد التسريعات المستحقة والقادمة بحسب تاريخ أول ترفيع بعد الاحتساب والدرجة قبل احتساب الشهادة.</p>
    </div>

    <!-- بطاقة المدخلات -->
    <div class="card no-print">
      <div class="card-head"><h2>المدخلات</h2></div>

      <div class="f-row">
        <div>
          <label class="lb" for="d0">تاريخ أول ترفيع في القصاصة بعد الاحتساب</label>
          <input class="in n" type="date" id="d0">
        </div>

        <div>
          <label class="lb" for="g0">الدرجة قبل احتساب الشهادة</label>
          <select class="in" id="g0">
            <option value="6">الدرجة 6</option>
            <option value="5">الدرجة 5</option>
            <option value="4" selected>الدرجة 4</option>
            <option value="3">الدرجة 3</option>
            <option value="2">الدرجة 2</option>
            <option value="1">الدرجة 1</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn" id="go">احسب</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <!-- بطاقة النتائج -->
    <div class="card hidden" id="resultsCard">
      <div class="card-head"><h2>النتيجة</h2></div>

      <div class="res-row">
        <div class="res due">
          <div class="rt">عدد التسريعات المستحقة</div>
          <div class="rv n" id="vDue">0</div>
          <div class="rd" id="dDue"></div>
        </div>

        <div class="res next">
          <div class="rt">عدد التسريعات القادمة</div>
          <div class="rv n" id="vNext">0</div>
          <div class="rd" id="dNext"></div>
        </div>
      </div>

      <table class="tbl">
        <thead>
          <tr>
            <th>#</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <div class="btn-row no-print">
        <button class="btn secondary" onclick="window.print()">طباعة</button>
      </div>

      <div class="sig n" id="today"></div>
    </div>

  </div>

  <script src="https://srccom.github.io/q.js"></script>
</body>
</html>
